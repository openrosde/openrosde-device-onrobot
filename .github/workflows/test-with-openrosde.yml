# Tests this device with the core of OpenRoSDE, 'openrosde/openrosde', through its reusable workflow 'extension.yml'.
# The core, which pins no device, checks out this commit beside the extensions that it pins, adds this device to every setup, tests it on the setup of the UR5e alone, and publishes nothing.
# https://github.com/openrosde/openrosde/blob/dev/docs/extensions.md

name: Test with OpenRoSDE

on:
  push:
    branches:
      - main
  pull_request:
  # Lets a maintainer test the default branch again by hand, such as after a new version of the core.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-with-openrosde-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openrosde:
    uses: openrosde/openrosde/.github/workflows/extension.yml@dev
    with:
      core-ref: dev
      extra-extensions: openrosde-device-onrobot
      # The setup of the UR5e alone, since a device of ROS 1 cannot build on a setup of ROS 2.
      setups: ur5e
