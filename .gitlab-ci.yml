# Documentation for configuration of GitLab CI jobs with 'gitlab-ci.yml':
# https://docs.gitlab.com/ci/yaml/
# https://docs.gitlab.com/ci/docker/using_docker_build/

# This pipeline tests the OnRobot device with OpenRoSDE.
# It clones OpenRoSDE on 'dev' anonymously, with the public extensions that the CI of OpenRoSDE tests, adds this repository to 'extensions/', and tests the 'ur5e' setup with this device added to it.
# The test builds the Docker layer of the device on the published 'ur5e-devel:dev' image, builds the Catkin workspaces of the setup, and runs 'ci/check-in-container.bash' in a container without any network, which starts no node.
# The UR5e platform comes from OpenRoSDE itself, or from 'openrosde-platform-ur5e' once 'gitlab-ci/extensions.repos' of OpenRoSDE lists it, since 'gitlab-ci/clone-extensions.bash' clones every extension that file lists, so this pipeline needs no change when the platform moves.

################################################################################

# Run one pipeline per change: for a merge request, for a branch without an open merge request, or for a tag.
# https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

################################################################################

# Select the runner, OpenRoSDE, the setup, and the published images to test with.

variables:
  # 'privileged-docker' is the tag of a self-managed Docker executor with privileged mode, which Docker-in-Docker needs.
  OPENROSDE_CI_RUNNER_TAG: privileged-docker
  # OpenRoSDE to test with, cloned anonymously over HTTPS.
  OPENROSDE_CI_CORE_URL: https://gitlab.com/coarobo/SDE.git
  OPENROSDE_CI_CORE_BRANCH: dev
  OPENROSDE_CI_CORE_DIR: /openrosde
  # Folder name of this device in 'extensions/', which the setups of OpenRoSDE list in 'OPENROSDE_ROBOT_EXTENSIONS'.
  OPENROSDE_CI_EXTENSION_NAME: openrosde-device-onrobot
  # Setup to test, with this device added to its extensions by 'gitlab-ci/test-catkin-workspaces.bash'.
  OPENROSDE_CI_ROBOT_SETUP: ur5e
  OPENROSDE_CI_EXTRA_EXTENSIONS: openrosde-device-onrobot
  # Registry and tag of the published base and platform images, which the test reads instead of the images of a pipeline of OpenRoSDE.
  OPENROSDE_CI_IMAGE_REGISTRY: registry.gitlab.com/coarobo/sde
  OPENROSDE_CI_IMAGE_TAG: dev
  # Docker-in-Docker with TLS, as GitLab documents it for the Docker executor.
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  GIT_SUBMODULE_STRATEGY: recursive

################################################################################

# Define the pipeline stages.

stages:
  - test-stage

################################################################################

# Test the device in the setup, after checking that no script of 'ci/' can move a robot.
# The Docker images are pinned to one version, as in OpenRoSDE, and the CLI image and the Docker-in-Docker service must be updated together.
# Keep the Catkin logs for a week when the test fails.

test-device-job:
  stage: test-stage
  image: docker:29.8.1-cli
  services:
    - docker:29.8.1-dind
  tags:
    - $OPENROSDE_CI_RUNNER_TAG
  timeout: 2h
  interruptible: true
  before_script:
    # Install Bash, which the scripts of OpenRoSDE need, in the Alpine image of the Docker CLI.
    - apk add --no-cache bash > /dev/null
    # Wait for the Docker-in-Docker service, which takes a few seconds to create its certificates.
    - for OPENROSDE_CI_WAIT_SECOND in $(seq 1 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
  script:
    # Clone OpenRoSDE with its submodules, anonymously, without the Git configuration of the machine and without the token of the job.
    - env -u CI_JOB_TOKEN GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 --branch "${OPENROSDE_CI_CORE_BRANCH}" --recurse-submodules "${OPENROSDE_CI_CORE_URL}" "${OPENROSDE_CI_CORE_DIR}"
    - cd "${OPENROSDE_CI_CORE_DIR}"
    - echo "Testing with OpenRoSDE at '$(git rev-parse HEAD)' of '${OPENROSDE_CI_CORE_BRANCH}'."
    # Clone the public extensions that the CI of OpenRoSDE tests, such as the platforms that left it.
    - bash ./gitlab-ci/clone-extensions.bash gitlab-ci/extensions.repos
    # Add this repository as an extension, in place of any clone of the same name.
    - rm -rf "extensions/${OPENROSDE_CI_EXTENSION_NAME}"
    - cp -a "${CI_PROJECT_DIR}" "extensions/${OPENROSDE_CI_EXTENSION_NAME}"
    # Check that no script of 'ci/' can move a robot, before any of them runs.
    - bash ./gitlab-ci/check-no-motion.bash "extensions/${OPENROSDE_CI_EXTENSION_NAME}/ci"
    # Build and check the setup with this device, and keep the Catkin logs in the project when it fails.
    - bash ./gitlab-ci/test-catkin-workspaces.bash "${OPENROSDE_CI_ROBOT_SETUP}" || { cp -a ci-logs "${CI_PROJECT_DIR}/" > /dev/null 2>&1; exit 1; }
  artifacts:
    when: on_failure
    paths:
      - ci-logs/
    expire_in: 1 week
